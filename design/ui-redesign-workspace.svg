<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF3F6"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="180" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38617F"/>
      <stop offset="1" stop-color="#2F4F6D"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1D2F3E" flood-opacity="0.09"/>
    </filter>
    <style>
      text { font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #23313F; }
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", "Songti SC", serif; }
      .muted { fill: #657586; }
      .tiny { font-size: 14px; }
      .small { font-size: 16px; }
      .body { font-size: 18px; }
      .title { font-size: 30px; font-weight: 650; }
      .h2 { font-size: 24px; font-weight: 650; }
      .label { font-size: 12px; font-weight: 760; letter-spacing: 2.2px; fill: #4F7EA6; }
      .chipText { font-size: 14px; fill: #425364; font-weight: 650; }
      .buttonText { font-size: 16px; fill: #FFFFFF; font-weight: 720; }
      .navText { font-size: 16px; fill: #32465A; font-weight: 650; }
      .line { stroke: rgba(73,94,115,0.14); }
      .panel { fill: rgba(255,255,255,0.86); stroke: rgba(73,94,115,0.14); }
      .surface { fill: rgba(248,251,253,0.96); stroke: rgba(73,94,115,0.12); }
      .selected { fill: rgba(79,126,166,0.10); stroke: rgba(79,126,166,0.22); }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="0" fill="url(#pageBg)"/>
  <circle cx="156" cy="92" r="190" fill="#86A9C8" fill-opacity="0.10"/>

  <!-- Top project bar -->
  <rect x="32" y="28" width="1536" height="122" rx="18" class="panel" filter="url(#softShadow)"/>
  <text x="64" y="62" class="label">NOVEL WORLDBUILDING CHATBOT</text>
  <text x="64" y="104" class="serif title">默认小说企划</text>
  <rect x="300" y="78" width="272" height="38" rx="19" fill="rgba(79,126,166,0.10)" stroke="rgba(79,126,166,0.14)"/>
  <text x="318" y="102" class="chipText">当前会话：铁轨帝国与古典学院</text>
  <text x="64" y="134" class="tiny muted">用真实对话生成设定，并把结果即时沉淀成世界观与大纲。</text>

  <rect x="770" y="70" width="128" height="44" rx="12" class="selected"/>
  <text x="790" y="98" class="navText">创作工作台</text>
  <rect x="910" y="70" width="110" height="44" rx="12" fill="rgba(255,255,255,0.74)" stroke="rgba(73,94,115,0.14)"/>
  <text x="934" y="98" class="navText">世界观库</text>
  <rect x="1032" y="70" width="126" height="44" rx="12" fill="rgba(255,255,255,0.74)" stroke="rgba(73,94,115,0.14)"/>
  <text x="1054" y="98" class="navText">大纲工作台</text>

  <rect x="1200" y="54" width="86" height="32" rx="16" fill="rgba(79,126,166,0.08)"/>
  <text x="1217" y="75" class="chipText">3 会话</text>
  <rect x="1296" y="54" width="96" height="32" rx="16" fill="rgba(79,126,166,0.08)"/>
  <text x="1313" y="75" class="chipText">18 设定</text>
  <rect x="1402" y="54" width="96" height="32" rx="16" fill="rgba(79,126,166,0.08)"/>
  <text x="1419" y="75" class="chipText">9 节点</text>
  <rect x="1336" y="98" width="162" height="40" rx="12" fill="rgba(255,255,255,0.82)" stroke="rgba(73,94,115,0.14)"/>
  <text x="1386" y="123" class="navText">模型设置</text>

  <!-- Main grid -->
  <rect x="32" y="174" width="252" height="794" rx="18" class="panel" filter="url(#softShadow)"/>
  <text x="56" y="208" class="label">SESSION</text>
  <text x="56" y="242" class="serif h2">创作场景</text>
  <text x="56" y="270" class="tiny muted">最近会话作为创作入口</text>
  <rect x="56" y="296" width="204" height="46" rx="12" fill="url(#primary)"/>
  <text x="112" y="325" class="buttonText">新建会话</text>

  <rect x="56" y="368" width="204" height="82" rx="14" class="selected"/>
  <text x="74" y="398" class="small" font-weight="700">铁轨帝国与学院</text>
  <text x="74" y="426" class="tiny muted">今天 21:10</text>
  <rect x="56" y="462" width="204" height="82" rx="14" class="surface"/>
  <text x="74" y="492" class="small" font-weight="700">修真蒸汽机械</text>
  <text x="74" y="520" class="tiny muted">昨天 19:42</text>
  <rect x="56" y="556" width="204" height="82" rx="14" class="surface"/>
  <text x="74" y="586" class="small" font-weight="700">星际政治草案</text>
  <text x="74" y="614" class="tiny muted">5 月 18 日</text>

  <line x1="56" y1="690" x2="260" y2="690" stroke="rgba(73,94,115,0.14)"/>
  <text x="56" y="728" class="label">PROMPT IDEAS</text>
  <text x="56" y="760" class="small" font-weight="700">快速起手</text>
  <rect x="56" y="780" width="204" height="60" rx="14" class="surface"/>
  <text x="74" y="806" class="tiny">设计魔法工业世界</text>
  <text x="74" y="826" class="tiny muted">世界背景 / 核心冲突</text>
  <rect x="56" y="852" width="204" height="60" rx="14" class="surface"/>
  <text x="74" y="878" class="tiny">梳理科技体系</text>
  <text x="74" y="898" class="tiny muted">规则 / 代价 / 限制</text>

  <!-- Workspace center -->
  <rect x="304" y="174" width="850" height="794" rx="18" class="panel" filter="url(#softShadow)"/>
  <text x="334" y="208" class="label">WORKSPACE</text>
  <text x="334" y="246" class="serif h2">铁轨帝国与古典学院</text>
  <text x="334" y="276" class="small muted">当前目标：补全科技体系、魔法体系与第一幕冲突。</text>
  <rect x="896" y="204" width="220" height="88" rx="14" fill="rgba(245,249,252,0.92)" stroke="rgba(73,94,115,0.12)"/>
  <rect x="916" y="222" width="72" height="28" rx="14" fill="rgba(79,126,166,0.12)"/>
  <text x="930" y="241" class="tiny" font-weight="700">真实调用</text>
  <text x="916" y="268" class="tiny muted">回复会同步沉淀为</text>
  <text x="916" y="288" class="tiny muted">设定条目和大纲节点</text>

  <rect x="334" y="330" width="760" height="86" rx="14" fill="rgba(248,251,253,0.96)" stroke="rgba(73,94,115,0.12)"/>
  <text x="354" y="358" class="tiny muted">作者 · 21:08</text>
  <text x="354" y="388" class="body">请把蒸汽铁路帝国和古典法术学院的核心矛盾继续展开。</text>

  <rect x="334" y="436" width="760" height="196" rx="14" fill="rgba(255,255,255,0.98)" stroke="rgba(73,94,115,0.14)"/>
  <text x="354" y="464" class="tiny muted">AI 助手 · 21:09</text>
  <text x="354" y="498" class="body">可以把矛盾设为：铁路总署发现符印机巧学能替代学院的空间调度权。</text>
  <text x="354" y="532" class="body">学院并非反对工业，而是害怕标准化工程绕开誓约、血统和仪式审查。</text>
  <text x="354" y="566" class="body">第一幕的关键事件应是一场边疆列车事故，事故暴露旧封印被新干线扰动。</text>
  <text x="354" y="600" class="body">这会自然把主角推入帝国、学院和灾厄三方的夹缝。</text>

  <rect x="334" y="666" width="760" height="246" rx="16" fill="rgba(247,250,252,0.92)" stroke="rgba(73,94,115,0.14)"/>
  <text x="356" y="700" class="label">PROMPT</text>
  <text x="356" y="732" class="small" font-weight="700">当前创作输入</text>
  <text x="880" y="732" class="tiny muted">Enter 发送 / Shift + Enter 换行</text>
  <rect x="356" y="756" width="716" height="96" rx="12" fill="#FFFFFF" stroke="rgba(73,94,115,0.16)"/>
  <text x="378" y="790" class="small muted">继续细化学院内部派系，并把科技体系改成更偏军工...</text>
  <rect x="356" y="872" width="230" height="32" rx="16" fill="rgba(79,126,166,0.08)"/>
  <text x="374" y="893" class="chipText">世界观与大纲同步沉淀</text>
  <rect x="906" y="862" width="166" height="42" rx="13" fill="url(#primary)"/>
  <text x="936" y="889" class="buttonText">发送并整理</text>

  <!-- Summary right panel -->
  <rect x="1174" y="174" width="394" height="794" rx="18" class="panel" filter="url(#softShadow)"/>
  <text x="1200" y="208" class="label">SUMMARY</text>
  <text x="1200" y="242" class="serif h2">整理结果</text>
  <rect x="1488" y="208" width="48" height="34" rx="10" fill="rgba(255,255,255,0.78)" stroke="rgba(73,94,115,0.14)"/>
  <text x="1500" y="231" class="tiny muted">收起</text>

  <text x="1200" y="292" class="small" font-weight="700">本轮新增</text>
  <text x="1200" y="318" class="tiny muted">先看当前会话沉淀了什么</text>
  <rect x="1200" y="340" width="336" height="96" rx="14" class="surface"/>
  <rect x="1218" y="356" width="70" height="26" rx="13" fill="rgba(79,126,166,0.10)"/>
  <text x="1230" y="374" class="tiny" font-weight="700">科技体系</text>
  <text x="1218" y="404" class="small" font-weight="700">军用铁路工业</text>
  <text x="1218" y="424" class="tiny muted">以装甲机车、轨道炮和边疆补给线构成国家动脉。</text>

  <rect x="1200" y="450" width="336" height="96" rx="14" class="surface"/>
  <rect x="1218" y="466" width="70" height="26" rx="13" fill="rgba(79,126,166,0.10)"/>
  <text x="1230" y="484" class="tiny" font-weight="700">冲突</text>
  <text x="1218" y="514" class="small" font-weight="700">效率统治与古法合法性</text>
  <text x="1218" y="534" class="tiny muted">帝国和学院都认为自己才是唯一可行的救国方案。</text>

  <line x1="1200" y1="582" x2="1536" y2="582" stroke="rgba(73,94,115,0.14)"/>
  <text x="1200" y="624" class="small" font-weight="700">世界观概览</text>
  <rect x="1430" y="600" width="106" height="34" rx="10" fill="rgba(255,255,255,0.78)" stroke="rgba(73,94,115,0.14)"/>
  <text x="1446" y="623" class="tiny muted">打开库</text>
  <rect x="1200" y="648" width="336" height="52" rx="12" class="surface"/>
  <text x="1218" y="672" class="small" font-weight="700">世界背景</text>
  <text x="1458" y="672" class="tiny muted">已整理</text>
  <rect x="1200" y="710" width="336" height="52" rx="12" class="surface"/>
  <text x="1218" y="734" class="small" font-weight="700">魔法体系</text>
  <text x="1458" y="734" class="tiny muted">已整理</text>
  <rect x="1200" y="772" width="336" height="52" rx="12" class="surface"/>
  <text x="1218" y="796" class="small" font-weight="700">剧情大纲</text>
  <text x="1458" y="796" class="tiny muted">9 节点</text>

  <line x1="1200" y1="850" x2="1536" y2="850" stroke="rgba(73,94,115,0.14)"/>
  <text x="1200" y="890" class="small" font-weight="700">大纲概览</text>
  <text x="1200" y="918" class="tiny muted">第一幕：列车事故与禁忌档案</text>
  <text x="1200" y="944" class="tiny muted">第二幕：边疆崩坏与权力决裂</text>
</svg>
